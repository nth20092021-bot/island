<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏝️</text></svg>">
  <title>3D Treasure Island - Hòn Đảo Kho Báu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700;800&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="/src/style.css" />
  <link rel="stylesheet" href="./tracnghiem_1003/dv-transition.css" />
</head>
<body>
  <!-- Hoa văn trống đồng Đông Sơn dùng lại cho nút Bắt đầu và banner vinh danh -->
  <svg width="0" height="0" aria-hidden="true" style="position:absolute">
    <symbol id="drum-medallion" viewBox="0 0 240 240">
      <defs>
        <linearGradient id="gold-stroke" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f8ebc9" />
          <stop offset="0.45" stop-color="#d9ab52" />
          <stop offset="1" stop-color="#8a5f22" />
        </linearGradient>
      </defs>
      <g fill="none" stroke="url(#gold-stroke)">
        <circle cx="120" cy="120" r="116" stroke-width="2" />
        <circle cx="120" cy="120" r="108" stroke-width="1.2" opacity="0.85" />
        <circle cx="120" cy="120" r="97" stroke-width="9" stroke-dasharray="1.5 9.5" opacity="0.9" />
        <circle cx="120" cy="120" r="85" stroke-width="1.6" />
        <circle cx="120" cy="120" r="74" stroke-width="1" stroke-dasharray="3 6" opacity="0.8" />
        <circle cx="120" cy="120" r="60" stroke-width="4.5" stroke-dasharray="1.4 8.2" opacity="0.9" />
        <circle cx="120" cy="120" r="36" stroke-width="1.4" />
        <circle cx="120" cy="120" r="26" stroke-width="1" />
      </g>
      <g stroke="url(#gold-stroke)" stroke-width="3.4" stroke-linecap="round">
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(0 120 120)" />
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(30 120 120)" />
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(60 120 120)" />
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(90 120 120)" />
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(120 120 120)" />
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(150 120 120)" />
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(180 120 120)" />
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(210 120 120)" />
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(240 120 120)" />
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(270 120 120)" />
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(300 120 120)" />
        <line x1="120" y1="66" x2="120" y2="88" transform="rotate(330 120 120)" />
      </g>
      <g fill="url(#gold-stroke)">
        <circle cx="120" cy="120" r="7.5" />
        <circle cx="120" cy="20" r="2.6" />
        <circle cx="120" cy="220" r="2.6" />
        <circle cx="20" cy="120" r="2.6" />
        <circle cx="220" cy="120" r="2.6" />
      </g>
    </symbol>
  </svg>

  <!-- Vùng chứa WebGL 3D toàn màn hình -->
  <div id="app"></div>

  <!-- 1. Icon Bánh Răng cài đặt duy nhất ở góc trên bên phải -->
  <button id="btn-settings" class="icon-btn" title="Cài đặt" aria-label="Cài đặt">⚙️</button>

  <!-- Menu Cài Đặt (Popover) -->
  <div id="settings-popover" class="popover hidden">
    <div class="popover-header">
      <span>Cài đặt hệ thống</span>
      <button id="btn-close-settings" class="close-btn" aria-label="Đóng">&times;</button>
    </div>
    <div class="popover-body">
      <div class="form-group">
        <label for="select-chest">🎯 Chọn rương chiến thắng:</label>
        <select id="select-chest">
          <option value="">-- Ngẫu nhiên --</option>
        </select>
      </div>

      <div class="form-actions">
        <button id="btn-reset-cam" class="btn">🔄 Reset Camera</button>
        <button id="btn-sound" class="btn">🔊 Âm thanh: Bật</button>
      </div>

      <div class="students-list-group">
        <label>📋 28 Học sinh:</label>
        <div id="students-preview" class="students-scroll"></div>
      </div>
    </div>
  </div>

  <!-- 2. Nút BẮT ĐẦU duy nhất ở chính giữa phía dưới màn hình -->
  <div id="start-container">
    <svg class="drum-medallion" viewBox="0 0 240 240" aria-hidden="true">
      <use href="#drum-medallion" />
    </svg>
    <div class="start-eyebrow">Hòn đảo kho báu</div>
    <button id="btn-start" class="start-btn">
      <span class="play-icon">▶</span>
      <span>BẮT ĐẦU</span>
    </button>
  </div>

  <!-- Hiệu ứng bùng nổ ánh sáng toàn màn hình khi mở rương -->
  <div id="golden-flash" class="golden-flash"></div>

  <!-- Popup Vinh danh người chiến thắng -->
  <div id="winner-banner" class="winner-banner hidden" role="status" aria-live="polite">
    <div class="winner-medallion" aria-hidden="true">
      <svg viewBox="0 0 240 240"><use href="#drum-medallion" /></svg>
    </div>
    <div class="winner-eyebrow">Vinh danh</div>
    <div id="winner-name"></div>
    <div class="winner-meta">
      <span id="winner-chest-id" class="winner-badge"></span>
      <span class="winner-sep"></span>
      <span class="winner-sub">Hòn đảo kho báu</span>
    </div>
    <div class="winner-actions">
      <button id="btn-close-winner" class="winner-btn winner-btn-ghost">↩ Trở lại</button>
      <button id="btn-open-quiz" class="winner-btn">🧩 Câu hỏi</button>
    </div>
  </div>

  <div class="dv-wipe" id="dvWipe" aria-hidden="true">
    <div class="dv-wipe__bg"></div>
    <div class="dv-wipe__frame"></div>
    <div class="dv-wipe__stage">
      <span class="dv-wipe__ring dv-wipe__ring--outer"></span>
      <span class="dv-wipe__ring dv-wipe__ring--inner"></span>
      <div class="dv-wipe__core">
        <span class="dv-wipe__icon">🧩</span>
        <span class="dv-wipe__kicker">Giải mã ký ức</span>
        <span class="dv-wipe__title">Mở kho ký ức</span>
        <span class="dv-wipe__sub">7 mảnh ghép · 1965 – 1968</span>
      </div>
    </div>
  </div>

  <script src="./tracnghiem_1003/dv-transition.js"></script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
